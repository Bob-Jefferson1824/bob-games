<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1120">
<meta name="description" content="Discover games and projects made by Bob.">
<title>Bob Games</title>
<style>
:root{--bg:#090f1d;--panel:#111c2e;--panel2:#1a2940;--text:#f4f7fb;--muted:#aab8cc;--gold:#f2ad43;--line:#293951}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{max-width:1220px;margin:auto;padding:0 24px}
header{position:sticky;top:0;z-index:5;background:#0b1120ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:950;letter-spacing:.08em}
.logo{width:42px;height:42px;border-radius:13px;background:var(--gold);color:#172033;display:grid;place-items:center;font-size:19px;font-weight:1000;letter-spacing:-2px}
nav{display:flex;gap:24px;color:var(--muted);font-weight:700}nav a:hover,nav a.active{color:white}
.hero{padding:68px 0 44px;background:radial-gradient(ellipse at 82% 0%,#294d7966,transparent 48%),linear-gradient(180deg,#101c30 0%,var(--bg) 100%)}
.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(40px,6vw,68px);line-height:1.02;letter-spacing:-.05em;margin:12px 0}
.hero p{max-width:650px;color:var(--muted);font-size:18px;margin:16px 0 26px}
.searchrow{display:flex;gap:12px;max-width:720px}.search{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:white;outline:none}.search:focus{border-color:var(--gold)}
.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:36px 0 18px}.sectionhead h2{font-size:26px;margin:0;letter-spacing:-.03em}.sectionhead p{margin:4px 0 0;color:var(--muted)}
.filtergroup{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 22px}.filterfield{display:flex;flex-direction:column;gap:7px;min-width:190px}.filterlabel{color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.filterselect{appearance:auto;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 38px 11px 13px;border-radius:10px;min-width:210px;cursor:pointer;outline:none}.filterselect:focus{border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px;padding-bottom:72px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:transform .18s,border-color .18s;cursor:pointer;min-width:0}.card:hover{transform:translateY(-4px);border-color:#7188a6}
.cover{height:184px;position:relative;overflow:hidden;background:#17263a}.cover svg{display:block;width:100%;height:100%}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07101e66,transparent 62%);pointer-events:none}
.coverlabel{position:absolute;left:16px;bottom:12px;z-index:1;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 2px 8px #0009}
.cardbody{padding:16px}.card h3{font-size:19px;margin:0 0 5px}.desc{font-size:13px;color:var(--muted);min-height:42px;margin:0 0 14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;font-weight:900;letter-spacing:.045em;padding:5px 8px;border-radius:6px;background:#24344b;color:#dce7f5}.tag.online{background:#173d38;color:#8ee1c5}.tag.solo{background:#3a304d;color:#d7baff}.tag.soon{background:#49351e;color:#ffd18a}
.cardfoot{border-top:1px solid var(--line);padding:11px 16px;color:var(--gold);font-size:13px;font-weight:900;display:flex;justify-content:space-between}
.empty{color:var(--muted);padding:35px 0;display:none}
footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:13px}
.detail{padding:34px 0 70px}.back{display:inline-flex;gap:8px;color:var(--muted);margin-bottom:20px;font-weight:750}.detailhero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center}
.detail .cover{height:340px;border-radius:20px}.detail h1{font-size:clamp(38px,5vw,56px)}.detaildesc{color:var(--muted);font-size:17px;max-width:650px}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--gold);color:#172033;padding:13px 20px;border-radius:11px;font-weight:950;margin-top:15px}.primary.disabled{opacity:.45;pointer-events:none}
.info{margin-top:32px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px}.info h2{margin:0 0 15px;font-size:20px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fact{background:var(--panel2);padding:14px;border-radius:11px}.fact span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.fact strong{font-size:15px}.notice{color:var(--muted);font-size:13px;margin-top:14px}\n.creator-card{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;max-width:850px}.creator-top{display:flex;align-items:center;gap:18px;margin-bottom:18px}.creator-avatar{width:72px;height:72px;flex:0 0 72px;border-radius:20px;background:linear-gradient(135deg,#f2ad43,#b86d2d);display:grid;place-items:center;color:#172033;font-size:27px;font-weight:1000;letter-spacing:-2px}.creator-card h2{margin:0;font-size:25px}.creator-card p{color:var(--muted);margin:8px 0 18px}.creator-links{display:flex;gap:10px;flex-wrap:wrap}.creator-link{display:inline-flex;align-items:center;gap:9px;padding:11px 15px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:850;transition:border-color .15s,transform .15s}.creator-link:hover{border-color:var(--gold);transform:translateY(-2px)}.creator-link span{color:var(--gold)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detailhero{grid-template-columns:1fr}.detail .cover{height:270px}}
@media(max-width:560px){.wrap{padding:0 16px}.nav{height:66px}nav{gap:13px;font-size:13px}.hero{padding:48px 0 30px}.grid{gap:12px}.cover{height:130px}.cardbody{padding:12px}.card h3{font-size:16px}.desc{font-size:12px}.facts{grid-template-columns:repeat(2,1fr)}.detail .cover{height:210px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="#home"><span class="logo">BG</span><span>BOB GAMES</span></a><nav><a href="#home" class="active">Home</a><a href="#games">All Games</a><a href="#about">About</a></nav></div></header>
<main id="app"></main>
<footer><div class="wrap">© <span id="year"></span> Bob Games · Games and projects made by Bob.</div></footer>
<script>
const games=[
{id:"gpt-1",name:"GPT 1",genre:"Open World · Action · Driving",category:"Action",description:"A GTA-style browser game with a large world to explore, vehicles to drive and more features being developed.",mode:"Singleplayer",modes:["Singleplayer"],multiplayer:"No",online:"No",platform:"Web browser",price:"Free",art:"gpt",url:"https://bob-jefferson1824.github.io/gpt-1/",status:"Available to play",kind:"GAME",tone:["#182d43","#477d87","#e8b75d"]},
{id:"dig-build",name:"Dig Build",genre:"Sandbox · Building · Survival",category:"Sandbox",description:"Explore a block-based world, gather resources, build structures and play alongside other players.",mode:"Singleplayer and multiplayer",modes:["Singleplayer","Multiplayer"],multiplayer:"Yes",online:"Yes",platform:"Web browser",price:"Free",art:"dig",url:"https://bob-jefferson1824.github.io/dig-build/",status:"Available to play",kind:"GAME",tone:["#174b48","#70a65b","#d9c17a"]},
{id:"physics-brawler",name:"Physics Brawler",genre:"Action · Fighting · Physics",category:"Action",description:"Jump into physics-driven arenas, battle bots and take on other players.",mode:"Singleplayer and multiplayer",modes:["Singleplayer","Multiplayer"],multiplayer:"Yes",online:"Yes (for online multiplayer)",platform:"Web browser",price:"Free",art:"physics",url:"https://bob-jefferson1824.github.io/physics-brawler/",status:"Available to play",kind:"GAME",tone:["#392752","#9b4d62","#f2b36d"]},
{id:"banner-and-blade",name:"Banner & Blade",genre:"Medieval · Strategy · Multiplayer",category:"Strategy",description:"Build your place in a medieval world, join a house and take part in battles with other players.",mode:"Multiplayer",modes:["Multiplayer"],multiplayer:"Yes",online:"Yes",platform:"Web browser",price:"Free",art:"banner",url:"https://bob-jefferson1824.github.io/banner-and-blade/",status:"Available to play",kind:"GAME",tone:["#1e3155","#9c7138","#e6c47a"]},
{id:"cargo-chaos",name:"Cargo Chaos",genre:"Simulation · Cargo · Ships",category:"Simulation",description:"A cargo-themed game project featuring ships, containers, cranes and a busy port.",mode:"Details coming soon",multiplayer:"To be confirmed",online:"To be confirmed",platform:"Web browser",price:"Free",art:"cargo",url:"",status:"Launch link coming soon",kind:"GAME",tone:["#183d55","#438c9c","#f2bd70"]},
{id:"chip-empire",name:"Chip Empire",genre:"Strategy · Management",category:"Strategy",description:"A game project by Bob. More information and the launch link will be added soon.",mode:"To be confirmed",multiplayer:"To be confirmed",online:"To be confirmed",platform:"To be confirmed",price:"To be confirmed",art:"chip",url:"",status:"Coming soon",kind:"GAME",tone:["#3a2855","#7c64b8","#edc16e"]},
{id:"sand-forge",name:"Sand Forge",genre:"Sandbox · Simulation · Creation",category:"Sandbox",description:"A physics sandbox where you can experiment with materials and create your own simulations.",mode:"To be confirmed",modes:[],multiplayer:"To be confirmed",online:"To be confirmed",platform:"Web browser",price:"Free",art:"sand",url:"https://bob-jefferson1824.github.io/sand-forge/",github:"https://github.com/Bob-Jefferson1824/sand-forge",status:"Available to play",kind:"GAME",tone:["#59402c","#b9824a","#f2d18b"]},
{id:"ember",name:"Ember",genre:"Community · Chat Platform",category:"Social",description:"A chat platform for communities to connect, talk and discover new conversations.",mode:"Online community platform",multiplayer:"Community chat",online:"Yes",platform:"Web browser",price:"Free",art:"ember",url:"https://ember-chat-5ee8.onrender.com",status:"Available to visit",kind:"PLATFORM",tone:["#572b28","#b84f38","#ffbd67"]}
];
const app=document.getElementById("app");let activeFilter="All",activeType="All",query="";
function cover(g){const [a,b,c]=g.tone;const shapes={
gta:`<path d="M0 180 L0 130 85 90 170 125 255 55 360 110 480 40 560 90 560 220H0Z" fill="#172c3c" opacity=".85"/><path d="M0 180L150 135 270 150 410 95 560 125V220H0Z" fill="#243d4c"/><path d="M210 220l70-90 70 90" fill="none" stroke="#f5c77b" stroke-width="5"/><path d="M80 168h120l22 20H60z" fill="#d7e3e7"/><path d="M105 153h62l20 15H90z" fill="#7bb4c1"/><circle cx="100" cy="190" r="12" fill="#101b29"/><circle cx="190" cy="190" r="12" fill="#101b29"/>`,
gpt:`<path d="M0 175L80 115 150 150 260 75 350 130 450 55 560 120V220H0Z" fill="#163447"/><path d="M0 188L145 155 260 170 390 125 560 160V220H0Z" fill="#254c56"/><path d="M40 220l110-62 65 62M300 220l95-80 90 80" fill="none" stroke="#e6b85f" stroke-width="5"/><path d="M205 160h145l-18 24H190z" fill="#e5e8e4"/><path d="M235 143h70l26 17H215z" fill="#6da5ae"/><circle cx="225" cy="187" r="13" fill="#101b29"/><circle cx="328" cy="187" r="13" fill="#101b29"/>`,
dig:`<path d="M0 160L110 95 210 145 330 70 450 135 560 80V220H0Z" fill="#214e47"/><path d="M0 180h560v40H0z" fill="#6d9850"/><g stroke="#172f32" stroke-width="3"><path d="M80 120h70v60H80zM150 150h70v50h-70zM390 110h70v70h-70z" fill="#b78b56"/><path d="M80 120l35-28 35 28M390 110l35-28 35 28" fill="#d6b77b"/></g><path d="M260 80l65 0M295 80l-28 42M295 80l30 42" stroke="#f1d08a" stroke-width="9" stroke-linecap="round"/>`,
physics:`<path d="M0 170L120 85 230 140 360 65 560 145V220H0Z" fill="#382747"/><circle cx="170" cy="110" r="47" fill="#d17a67" opacity=".25"/><circle cx="385" cy="95" r="60" fill="#d17a67" opacity=".18"/><path d="M205 105l40 18 35-15 23 26-14 44-44 18-42-25z" fill="#e4a56d" stroke="#512f48" stroke-width="7"/><path d="M239 127l-40-32M281 135l45-30M243 185l-30 25M283 178l30 28" stroke="#f6d19a" stroke-width="10" stroke-linecap="round"/>`,
banner:`<path d="M0 185L95 110 175 150 275 55 390 135 490 75 560 120V220H0Z" fill="#1b3151"/><path d="M0 190h560v30H0z" fill="#7b5a36"/><path d="M270 45v150" stroke="#d7c18a" stroke-width="7"/><path d="M277 52l110 22-110 48z" fill="#b74843" stroke="#f0d49a" stroke-width="4"/><path d="M225 180l55-90 55 90" fill="none" stroke="#e6d6ae" stroke-width="10"/><path d="M250 150h60" stroke="#e6d6ae" stroke-width="8"/>`,
cargo:`<path d="M0 150Q120 130 240 150T560 150V220H0Z" fill="#236b80"/><path d="M0 178Q120 158 240 178T560 178" fill="none" stroke="#83c7cf" stroke-width="4"/><path d="M95 105h250v65H95z" fill="#c77b43" stroke="#f2c17a" stroke-width="5"/><path d="M105 115h55v45h-55M170 115h55v45h-55M235 115h55v45h-55" fill="none" stroke="#713f32" stroke-width="4"/><path d="M365 35v130M365 50h100M450 50v70" stroke="#e9bd72" stroke-width="9"/><path d="M425 120h50v38h-50z" fill="#e9bd72"/>`,
chip:`<path d="M0 175L120 115 230 145 360 65 560 145V220H0Z" fill="#3a2b59"/><rect x="205" y="65" width="150" height="110" rx="15" fill="#b8a7e8" stroke="#f1d38a" stroke-width="6"/><rect x="235" y="90" width="90" height="60" rx="8" fill="#40335f"/><path d="M180 85h25M180 110h25M180 135h25M355 85h25M355 110h25M355 135h25M240 45v20M270 45v20M300 45v20M330 45v20M240 175v20M270 175v20M300 175v20M330 175v20" stroke="#f1d38a" stroke-width="7"/>`,
sand:`<path d="M0 150Q120 80 250 145T560 130V220H0Z" fill="#b47a45"/><path d="M0 180Q130 130 250 175T560 165V220H0Z" fill="#d7a96c"/><path d="M200 145l80-85 80 85z" fill="#6f5035" stroke="#f0d095" stroke-width="5"/><path d="M225 145v-35h110v35" fill="#e8c28b"/><path d="M255 110V82h50v28" fill="#8a6040"/><circle cx="440" cy="70" r="30" fill="#f5d58d" opacity=".9"/>`,
ember:`<path d="M0 180Q120 120 240 165T560 150V220H0Z" fill="#482b2b"/><path d="M280 35c-50 50-50 75-18 110 18 20 48 25 67 8 25-22 18-52-3-72 4 32-12 42-22 39-20-7-5-37-24-85z" fill="#ffb454"/><path d="M292 85c-20 28-22 43-8 58 10 10 25 8 31-2 8-14-3-25-8-32 1 14-8 19-13 12-5-7 1-21-2-36z" fill="#ffe0a0"/><circle cx="130" cy="80" r="5" fill="#ffd28b"/><circle cx="420" cy="65" r="7" fill="#ffd28b"/>`
};return `<div class="cover"><svg viewBox="0 0 560 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${g.name} illustrated cover"><defs><linearGradient id="grad-${g.id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><pattern id="grid-${g.id}" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".07"/></pattern></defs><rect width="560" height="220" fill="url(#grad-${g.id})"/><rect width="560" height="220" fill="url(#grid-${g.id})"/><circle cx="470" cy="38" r="95" fill="${c}" opacity=".15"/>${shapes[g.art]||""}</svg><span class="coverlabel">${g.kind} · BOB GAMES</span></div>`}
function tags(g){const modes=(g.modes||[]).map(m=>`<span class="tag ${m==="Multiplayer"?"online":"solo"}">${m.toUpperCase()}</span>`).join("");return `${modes||`<span class="tag">${g.kind==="PLATFORM"?"COMMUNITY":"MODE TBC"}</span>`}<span class="tag ${g.url?"":"soon"}">${g.url?"AVAILABLE":"COMING SOON"}</span>`}
function card(g){return `<article class="card" onclick="location.hash='game/${g.id}'" tabindex="0" role="link" aria-label="View ${g.name} details">${cover(g)}<div class="cardbody"><h3>${g.name}</h3><p class="desc">${g.description}</p><div class="tags">${tags(g)}</div></div><div class="cardfoot"><span>VIEW ${g.kind}</span><span>→</span></div></article>`}
function home(){const filtered=games.filter(g=>{const genreMatch=activeFilter==="All"||g.category===activeFilter;const modes=g.modes||[];const typeMatch=activeType==="All"||(activeType==="Available"&&!!g.url)||(activeType==="Coming Soon"&&!g.url)||(activeType==="Singleplayer"&&modes.includes("Singleplayer"))||(activeType==="Multiplayer"&&modes.includes("Multiplayer"))||(activeType==="Both"&&modes.includes("Singleplayer")&&modes.includes("Multiplayer"))||(activeType==="Online"&&(g.online==="Yes"||g.online.startsWith("Yes ")))||(activeType==="Offline"&&g.online==="No");return genreMatch&&typeMatch&&(`${g.name} ${g.genre} ${g.description} ${g.mode} ${g.category}`).toLowerCase().includes(query.toLowerCase())});app.innerHTML=`<section class="hero"><div class="wrap"><div class="eyebrow">THE BOB GAMES COLLECTION</div><h1>Find your next<br>game.</h1><p>Discover games and projects made by Bob. Explore the collection, check the details and jump straight into the action.</p><div class="searchrow"><input id="search" class="search" placeholder="Search games and projects..." value="${query.replace(/"/g,"&quot;")}" aria-label="Search games"></div></div></section><section class="wrap" id="games"><div class="sectionhead"><div><h2>All Games & Projects</h2><p>Browse the Bob Games collection.</p></div></div><div class="filtergroup"><label class="filterfield"><span class="filterlabel">Genre</span><select class="filterselect" aria-label="Filter by genre" onchange="setFilter(this.value)">${["All","Action","Sandbox","Strategy","Simulation","Social"].map(f=>`<option value="${f}" ${activeFilter===f?"selected":""}>${f==="All"?"All genres":f}</option>`).join("")}</select></label><label class="filterfield"><span class="filterlabel">Availability & play style</span><select class="filterselect" aria-label="Filter by availability and play style" onchange="setType(this.value)">${[["All","All games"],["Available","Available"],["Coming Soon","Coming soon"],["Singleplayer","Singleplayer"],["Multiplayer","Multiplayer"],["Both","Singleplayer & multiplayer"],["Online","Online play"],["Offline","Offline play"]].map(([v,l])=>`<option value="${v}" ${activeType===v?"selected":""}>${l}</option>`).join("")}</select></label></div><div class="grid">${filtered.map(card).join("")}</div><div class="empty" style="display:${filtered.length?"none":"block"}">No results found. Try another search.</div></section>`;document.getElementById("search").addEventListener("input",e=>{query=e.target.value;const pos=e.target.selectionStart;home();const el=document.getElementById("search");el.focus();el.setSelectionRange(pos,pos)})}
function setFilter(f){activeFilter=f;home()}function setType(f){activeType=f;home()}
function detail(id){const g=games.find(x=>x.id===id);if(!g){home();return}app.innerHTML=`<section class="wrap detail"><a class="back" href="#home">← Back to all games</a><div class="detailhero"><div><div class="eyebrow">${g.genre}</div><h1>${g.name}</h1><p class="detaildesc">${g.description}</p>${g.url?`<a class="primary" href="${g.url}" target="_blank" rel="noopener">↗ &nbsp; ${g.kind==="PLATFORM"?"VISIT EMBER":"PLAY GAME"}</a>`:`<span class="primary disabled">COMING SOON</span>`}${g.github?`<a class="creator-link" style="margin:15px 0 0 8px" href="${g.github}" target="_blank" rel="noopener">↗ View GitHub repository</a>`:""}<p class="notice">${g.status}</p></div>${cover(g)}</div><section class="info"><h2>${g.kind==="PLATFORM"?"Platform information":"Game information"}</h2><div class="facts"><div class="fact"><span>Game mode</span><strong>${g.mode}</strong></div><div class="fact"><span>Multiplayer</span><strong>${g.multiplayer}</strong></div><div class="fact"><span>Online required</span><strong>${g.online}</strong></div><div class="fact"><span>Platform</span><strong>${g.platform}</strong></div><div class="fact"><span>Price</span><strong>${g.price}</strong></div><div class="fact"><span>Type</span><strong>${g.kind==="PLATFORM"?"Chat platform":g.category}</strong></div></div><p class="notice">Game features and availability may change as each project is updated.</p></section></section>`}
function render(){const hash=location.hash;if(hash.startsWith("#game/"))detail(hash.slice(6));else if(hash==="#about"){app.innerHTML=`<section class="wrap detail"><a class="back" href="#home">← Back home</a><div class="eyebrow">ABOUT THE CREATOR</div><h1>About Bob Games</h1><p class="detaildesc">Bob Games is a collection of games and projects created and owned by Bob Jefferson. It is part of Bob Co, a company also owned by Bob.</p><section class="creator-card"><div class="creator-top"><div class="creator-avatar">BJ</div><div><div class="eyebrow">FOUNDER & OWNER</div><h2>Bob Jefferson</h2></div></div><p>I’m the proud owner of Bob Games, part of Bob Co. I create games, platforms and other projects, bringing them together here for everyone to explore.</p><div class="creator-links"><a class="creator-link" href="https://stt.gg/mTKFZsyX" target="_blank" rel="noopener"><span>↗</span> Stoat Community</a><a class="creator-link" href="https://ember-chat-5ee8.onrender.com" target="_blank" rel="noopener"><span>↗</span> Ember</a></div></section></section>`}else home();document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")===(hash==="#games"?"#games":hash==="#about"?"#about":"#home")))}
window.addEventListener("hashchange",render);document.getElementById("year").textContent=new Date().getFullYear();render();
</script>
</body>
</html>
